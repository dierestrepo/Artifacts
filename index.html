<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Embalses &ndash; Sistema Agregado Norte y Chuza</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.0/dist/chart.umd.js" integrity="sha384-iU8HYtnGQ8Cy4zl7gbNMOhsDTTKX02BTXptVP/vqAWIaTfM7isw76iyZCsjL2eVi" crossorigin="anonymous"></script>
<style>
:root{color-scheme:light}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:#eceff1;color:#1a1a2e;min-height:100vh;padding:16px}
.card{background:#fff;border-radius:14px;box-shadow:0 2px 16px rgba(0,0,0,.12);padding:22px 24px 18px;max-width:1280px;margin:0 auto}
h1{font-size:1.15rem;font-weight:700;text-align:center;color:#1a237e;margin-bottom:3px}
.subtitle{text-align:center;font-size:.76rem;color:#777;margin-bottom:4px}
.credit{text-align:center;font-size:.68rem;color:#aaa;margin-bottom:12px}
.emb-tabs{display:flex;gap:10px;justify-content:center;margin-bottom:14px;flex-wrap:wrap}
.emb{padding:8px 22px;border-radius:22px;border:2px solid #ccc;background:#fafafa;font-size:.86rem;cursor:pointer;font-weight:700;transition:all .15s;color:#666;line-height:1.15}
.emb small{display:block;font-size:.62rem;font-weight:600;opacity:.75;margin-top:1px}
.emb:hover{background:#eee}
.emb.active{color:#fff}
.view-tabs{display:flex;gap:8px;justify-content:center;margin-bottom:14px;flex-wrap:wrap}
.vtab{padding:6px 20px;border-radius:20px;border:1.5px solid #ccc;background:#f5f5f5;font-size:.8rem;cursor:pointer;font-weight:600;transition:all .15s}
.vtab:hover{background:#e0e0e0}
.vtab.active{background:#1a237e;color:#fff;border-color:#1a237e}
.chart-wrap{position:relative;height:460px;margin-bottom:4px}
.controls{border-top:1px solid #e0e0e0;padding-top:12px;margin-top:8px}
.ctrl-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:10px}
.ctrl-label{font-size:.73rem;font-weight:700;color:#555;min-width:60px}
.btn{padding:4px 11px;border-radius:5px;border:1px solid #ccc;background:#f5f5f5;font-size:.73rem;cursor:pointer;transition:background .15s}
.btn:hover{background:#e0e0e0}
.btn-blue{background:#1565c0;color:#fff;border-color:#1565c0}
.btn-blue:hover{background:#0d47a1}
.btn-red{background:#c62828;color:#fff;border-color:#c62828}
.btn-red:hover{background:#b71c1c}
.year-chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 10px 3px 8px;border-radius:20px;font-size:.73rem;font-weight:600;cursor:pointer;border:2px solid currentColor;transition:opacity .15s,transform .1s;user-select:none;background:rgba(0,0,0,.05)}
.chip .dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.chip.off{opacity:.3;background:#f5f5f5;border-color:#bbb;color:#999}
.chip:hover{transform:scale(1.06)}
.chip-guia{background:#212121;color:#fff;border-color:#212121}
.chip-guia.off{opacity:.35;background:#aaa;border-color:#aaa}
.info-bar{font-size:.73rem;color:#888;margin-top:9px}
.info-bar b{color:#444}
.period-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px;padding-top:4px}
.pbtn{padding:6px 20px;border-radius:20px;border:1.5px solid #ccc;background:#f5f5f5;font-size:.8rem;cursor:pointer;font-weight:600;transition:all .15s}
.pbtn:hover{background:#e0e0e0}
.pbtn.active{background:#bf360c;color:#fff;border-color:#bf360c}
.met-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;margin-bottom:10px}
.mbtn{padding:5px 16px;border-radius:18px;border:1.5px solid #ccc;background:#f5f5f5;font-size:.78rem;cursor:pointer;font-weight:600;transition:all .15s}
.mbtn:hover{background:#e0e0e0}
.mbtn.active{background:#37474f;color:#fff;border-color:#37474f}
.afl-legend{display:flex;gap:18px;justify-content:center;margin-bottom:12px;flex-wrap:wrap}
.afl-leg-item{display:flex;align-items:center;gap:6px;font-size:.78rem;font-weight:600}
.afl-leg-swatch{width:18px;height:14px;border-radius:3px;flex-shrink:0}
.afl-note{text-align:center;font-size:.72rem;color:#888;margin-top:6px;font-style:italic}
#tt{position:fixed;background:rgba(20,20,40,.93);color:#fff;padding:8px 12px;border-radius:8px;font-size:.76rem;pointer-events:none;z-index:9999;display:none;line-height:1.6;max-width:220px;box-shadow:0 4px 12px rgba(0,0,0,.3)}
</style>
</head>
<body>
<div class="card">
  <h1 id="h1">Curva de Volumen &ndash; Embalse de Chuza</h1>
  <div class="subtitle" id="sub"></div>
  <div class="credit">Elaborado por: Diego Restrepo</div>

  <div class="emb-tabs" id="embTabs"></div>

  <div class="view-tabs">
    <button class="vtab active" id="tabA" onclick="switchView('A')">Vista Por A&ntilde;o</button>
    <button class="vtab" id="tabM" onclick="switchView('M')">Vista Multianual</button>
    <button class="vtab" id="tabF" onclick="switchView('F')">Aportes y lluvia</button>
  </div>

  <div id="viewA">
    <div class="chart-wrap"><canvas id="ca"></canvas></div>
    <div class="controls">
      <div class="ctrl-row">
        <span class="ctrl-label">Acciones:</span>
        <button class="btn btn-blue" id="btnAll">Mostrar todos</button>
        <button class="btn btn-red" id="btnNone">Ocultar todos</button>
        <button class="btn" id="btnGuia">Curva Gu&iacute;a</button>
      </div>
      <div class="year-chips" id="chips"></div>
      <div class="info-bar" id="infoA"></div>
    </div>
  </div>

  <div id="viewM" style="display:none">
    <div class="period-row">
      <span class="ctrl-label">Periodo:</span>
      <button class="pbtn" id="pm3" onclick="loadMulti(3)">3 a&ntilde;os</button>
      <button class="pbtn active" id="pm5" onclick="loadMulti(5)">5 a&ntilde;os</button>
      <button class="pbtn" id="pm8" onclick="loadMulti(8)">8 a&ntilde;os</button>
    </div>
    <div class="chart-wrap"><canvas id="cm"></canvas></div>
    <div class="year-chips" id="chipsM"></div>
    <div class="info-bar" id="infoM"></div>
  </div>

  <div id="viewF" style="display:none">
    <div class="met-row" id="metRow"></div>
    <div class="afl-legend">
      <div class="afl-leg-item">
        <div class="afl-leg-swatch" style="background:#c2185b"></div>
        <span>Promedio hist&oacute;rico 2012&ndash;2022</span>
      </div>
      <div class="afl-leg-item">
        <div class="afl-leg-swatch" style="background:#1565c0"></div>
        <span>2026</span>
      </div>
    </div>
    <div class="chart-wrap"><canvas id="cf"></canvas></div>
    <div class="afl-note" id="aflNote"></div>
    <div class="info-bar" id="infoF" style="margin-top:8px"></div>
  </div>
</div>
<div id="tt"></div>

  for(var m=0; m<12; m++){
    var dm = dimM(yr,m);
    for(var d=1; d<=dm; d++, i++){
      if(v[i] === '') continue;
      pts.push({ x: Math.round((m + (d-1)/dm)*100)/100, y: +v[i] });
    }
  }
  return pts;
}

// ===== Estado =====
var EMB = 'chuza';       // embalse activo
var VISTA = 'A';
var MET = null;          // métrica activa de la 3a vista
var SERIES = {};         // año -> [{x,y}] del embalse activo
var YEARS = [];
var chartA = null, multiChart = null, flowChart = null;
var CE = {}, curMultiYrs = 5;
var tt = document.getElementById('tt');

function cfg(){ return DATA[EMB]; }
function tieneGuia(){ return !!GUIA[EMB]; }

// ===== Selector de embalse =====
(function(){
  var cont = document.getElementById('embTabs');
  ORDEN.forEach(function(k){
    var b = document.createElement('button');
    b.className = 'emb' + (k===EMB ? ' active' : '');
    b.id = 'emb-'+k;
    b.innerHTML = DATA[k].nom + '<small>' + DATA[k].sis + '</small>';
    if(k===EMB){ b.style.background = COLOR_EMB[k]; b.style.borderColor = COLOR_EMB[k]; }
    b.onclick = function(){ setEmbalse(k); };
    cont.appendChild(b);
  });
})();

function setEmbalse(k){
  if(k === EMB) return;
  EMB = k;
  ORDEN.forEach(function(e){
    var b = document.getElementById('emb-'+e);
    var on = (e===k);
    b.classList.toggle('active', on);
    b.style.background = on ? COLOR_EMB[e] : '';
    b.style.borderColor = on ? COLOR_EMB[e] : '';
  });
  cargarEmbalse();
}

function cargarEmbalse(){
  var c = cfg();
  SERIES = {};
  YEARS = Object.keys(c.vol).sort();
  YEARS.forEach(function(yr){ SERIES[yr] = serieDe(c.vol[yr], parseInt(yr)); });

  document.getElementById('h1').innerHTML = 'Curva de Volumen &ndash; Embalse ' +
    (EMB==='sisga' ? 'del Sisga' : EMB==='neusa' ? 'del Neusa' : EMB==='tomine' ? 'del Tominé' : 'de Chuza');
  var u = c.ult;
  document.getElementById('sub').innerHTML =
    c.sis + ' &nbsp;|&nbsp; Datos diarios ' + YEARS[0] + '&ndash;' + YEARS[YEARS.length-1] +
    ' &middot; Últimos datos: ' + u[2] + ' ' + MNC[u[1]-1] + ' ' + u[0] +
    ' &middot; Millones de m&sup3;';
  document.getElementById('tabF').textContent =
    (EMB==='chuza' ? 'Afluencias y lluvia' : 'Descargas y lluvia');
  document.getElementById('btnGuia').style.display = tieneGuia() ? '' : 'none';

  MET = c.orden[0];
  if(chartA){ chartA.destroy(); chartA = null; }
  if(multiChart){ multiChart.destroy(); multiChart = null; }
  if(flowChart){ flowChart.destroy(); flowChart = null; }
  tt.style.display = 'none';

  buildYear();
  if(VISTA === 'M') loadMulti(curMultiYrs);
  if(VISTA === 'F') initFlow();
}

// ===== VISTA POR ANO =====
function buildYear(){
  var c = cfg();
  var DS = [];
  if(tieneGuia()){
    DS.push({
      label:'Curva Guia', data:GUIA[EMB],
      borderColor:'#212121', backgroundColor:'transparent',
      borderWidth:3, borderDash:[10,5], pointRadius:5,
      pointBackgroundColor:'#212121', tension:.4,
      fill:false, showLine:true, order:0, hidden:false
    });
  }
  YEARS.forEach(function(yr){
    var col = CLRS[yr] || '#999';
    var w = parseInt(yr)>=2024 ? 2.5 : parseInt(yr)>=2020 ? 2 : 1.5;
    DS.push({
      label: yr, data: SERIES[yr],
      borderColor: col, backgroundColor:'transparent',
      borderWidth: w, pointRadius: 0, tension: 0,
      fill:false, showLine:true, hidden:false, order:1
    });
  });

  var ctxA = document.getElementById('ca').getContext('2d');
  chartA = new Chart(ctxA, {
    type:'scatter', data:{ datasets:DS },
    options:{
      responsive:true, maintainAspectRatio:false,
      animation:{ duration:150 },
      plugins:{ legend:{ display:false }, tooltip:{ enabled:false, external:showTip } },
      scales:{
        x:{
          type:'linear', min:0, max:12,
          ticks:{ stepSize:1, maxTicksLimit:13, callback:function(v){ var i=Math.round(v); return i<12?MN[i]:''; } },
          grid:{ color:'rgba(0,0,0,.06)' }
        },
        y:{
          min:0, max:c.ymax, ticks:{ stepSize:c.ystep },
          title:{ display:true, text:'Volumen (M m³)', font:{size:11} },
          grid:{ color:'rgba(0,0,0,.08)' }
        }
      }
    }
  });

  CE = {};
  var chipsDiv = document.getElementById('chips');
  chipsDiv.innerHTML = '';
  DS.forEach(function(ds, i){
    var isGC = ds.label === 'Curva Guia';
    var ch = document.createElement('div');
    ch.className = isGC ? 'chip chip-guia' : 'chip';
    if(!isGC){
      var dot = document.createElement('div');
      dot.className = 'dot'; dot.style.background = ds.borderColor;
      ch.style.color = ds.borderColor; ch.appendChild(dot);
    }
    ch.appendChild(document.createTextNode(ds.label));
    ch.onclick = function(){
      var vis = !chartA.isDatasetVisible(i);
      chartA.setDatasetVisibility(i, vis);
      chartA.update('none');
      ch.classList.toggle('off', !vis);
      infoA();
    };
    CE[ds.label] = { ch:ch, idx:i };
    chipsDiv.appendChild(ch);
  });
  infoA();
}

function showTip(ctx){
  if(!ctx.tooltip.opacity){ tt.style.display='none'; return; }
  var pt = ctx.tooltip.dataPoints[0];
  if(!pt){ return; }
  var yr = parseInt(pt.dataset.label);
  if(!yr){ tt.style.display='none'; return; }
  var dt = xToDate(yr, pt.parsed.x);
  tt.innerHTML = '<b>'+fmtD(dt)+'</b><br>'+pt.parsed.y.toFixed(1)+' M m³';
  var e = ctx.chart.canvas.getBoundingClientRect();
  tt.style.left = (e.left+ctx.tooltip.caretX+14)+'px';
  tt.style.top  = (e.top+ctx.tooltip.caretY-20)+'px';
  tt.style.display = 'block';
}

function infoA(){
  var el = document.getElementById('infoA');
  if(!chartA){ el.innerHTML=''; return; }
  var vis = YEARS.filter(function(yr){ return chartA.isDatasetVisible(CE[yr].idx); });
  if(!vis.length){ el.innerHTML='Ninguna curva visible.'; return; }
  var last = vis[vis.length-1];
  var s = SERIES[last];
  var lp = s[s.length-1];
  var dt = xToDate(parseInt(last), lp.x);
  var pct = (lp.y / cfg().vmax * 100).toFixed(1);
  el.innerHTML = '<b>'+vis.length+' años</b> visibles &middot; Último registro <b>'+last+'</b>: '+
    fmtD(dt)+' &mdash; <b>'+lp.y.toFixed(1)+' M m³</b> (<b>'+pct+'%</b> del máximo histórico, '+
    cfg().vmax.toFixed(1)+' M m³)';
}

document.getElementById('btnAll').onclick = function(){
  chartA.data.datasets.forEach(function(ds,i){ chartA.setDatasetVisibility(i,true); CE[ds.label].ch.classList.remove('off'); });
  chartA.update('none'); infoA();
};
document.getElementById('btnNone').onclick = function(){
  chartA.data.datasets.forEach(function(ds,i){ chartA.setDatasetVisibility(i,false); CE[ds.label].ch.classList.add('off'); });
  chartA.update('none'); infoA();
};
document.getElementById('btnGuia').onclick = function(){
  if(!CE['Curva Guia']) return;
  var i = CE['Curva Guia'].idx;
  var v = !chartA.isDatasetVisible(i);
  chartA.setDatasetVisibility(i,v);
  CE['Curva Guia'].ch.classList.toggle('off',!v);
  chartA.update('none'); infoA();
};

// ===== VISTA MULTIANUAL =====
var MULTI_PALETTE = ['#b0bec5','#78909c','#4db6ac','#42a5f5','#ab47bc','#ffa726','#ef5350','#bf360c'];

function getMultiColor(yr, startYr, endYr){
  var total = endYr - startYr;
  if(total === 0) return MULTI_PALETTE[MULTI_PALETTE.length - 1];
  var t = (yr - startYr) / total;
  var idx = Math.round(t * (MULTI_PALETTE.length - 1));
  return MULTI_PALETTE[Math.min(idx, MULTI_PALETTE.length - 1)];
}

function allPts(){
  var out = [];
  YEARS.forEach(function(yr){
    var y = parseInt(yr);
    SERIES[yr].forEach(function(pt){ out.push({ x:xToMs(y,pt.x), y:pt.y }); });
  });
  out.sort(function(a,b){ return a.x - b.x; });
  return out;
}

function buildGcPts(cutoff, maxTs){
  var gcPts = [];
  var startYr = new Date(cutoff).getFullYear();
  var endYr   = new Date(maxTs).getFullYear();
  var gcMaxTs = new Date(endYr, 11, 31).getTime();
  for(var yr = startYr; yr <= endYr; yr++){
    GUIA[EMB].forEach(function(p){
      var ts = xToMs(yr, p.x);
      if(ts >= cutoff && ts <= gcMaxTs) gcPts.push({x:ts, y:p.y});
    });
  }
  gcPts.sort(function(a,b){ return a.x - b.x; });
  return gcPts;
}

function buildMultiDatasets(cutoff, maxTs){
  var startYr = new Date(cutoff).getFullYear();
  var endYr   = new Date(maxTs).getFullYear();
  var datasets = [];
  for(var yr = startYr; yr <= endYr; yr++){
    var key = String(yr);
    if(!SERIES[key]) continue;
    var pts = [];
    SERIES[key].forEach(function(pt){
      var ts = xToMs(yr, pt.x);
      if(ts >= cutoff && ts <= maxTs) pts.push({x:ts, y:pt.y});
    });
    var isLatest = (yr === endYr);
    datasets.push({
      label: key, data: pts,
      borderColor: getMultiColor(yr, startYr, endYr),
      backgroundColor:'transparent',
      borderWidth: isLatest ? 2.5 : 1.4,
      showLine:true, pointRadius:0, tension:0, fill:false,
      order: endYr - yr + 1
    });
  }
  if(tieneGuia()){
    datasets.push({
      label:'Curva Guía', data: buildGcPts(cutoff, maxTs),
      borderColor:'#212121', backgroundColor:'transparent',
      borderWidth:1.5, borderDash:[8,4],
      showLine:true, pointRadius:0, tension:0.4, fill:false, order:99
    });
  }
  return datasets;
}

function loadMulti(years){
  curMultiYrs = years;
  ['pm3','pm5','pm8'].forEach(function(id){
    document.getElementById(id).classList.toggle('active', parseInt(id.slice(2))===years);
  });
  var pts = allPts();
  var maxTs = pts[pts.length-1].x;
  var maxDate = new Date(maxTs);
  var cutoff = new Date(maxDate.getFullYear()-years+1, 0, 1).getTime();
  document.getElementById('infoM').innerHTML =
    '<b>'+years+' años</b> &middot; '+fmtD(new Date(cutoff))+' &rarr; '+fmtD(maxDate);

  var datasets = buildMultiDatasets(cutoff, maxTs);

  if(multiChart){
    multiChart.data.datasets = datasets;
    multiChart.options.scales.y.max = cfg().ymax;
    multiChart.options.scales.y.ticks.stepSize = cfg().ystep;
    multiChart.update('none');
    buildMultiChips();
    return;
  }
  var ctx = document.getElementById('cm').getContext('2d');
  multiChart = new Chart(ctx, {
    type:'scatter', data:{ datasets: datasets },
    options:{
      responsive:true, maintainAspectRatio:false,
      animation:{ duration:400 },
      plugins:{
        legend:{ display:false },
        tooltip:{
          enabled:true, mode:'nearest', intersect:false,
          callbacks:{
            title:function(items){ return fmtD(new Date(items[0].parsed.x)); },
            label:function(item){
              if(item.dataset.label==='Curva Guía') return 'Curva Guía: '+item.parsed.y.toFixed(0)+' M m³';
              return item.dataset.label+': '+item.parsed.y.toFixed(1)+' M m³';
            }
          }
        }
      },
      scales:{
        x:{
          type:'linear',
          ticks:{
            maxTicksLimit:15,
            callback:function(v){
              var d=new Date(v);
              return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
            }
          },
          grid:{ color:'rgba(0,0,0,.05)' }
        },
        y:{
          min:0, max:cfg().ymax, ticks:{ stepSize:cfg().ystep },
          title:{ display:true, text:'Volumen (M m³)', font:{size:11} },
          grid:{ color:'rgba(0,0,0,.08)' }
        }
      }
    }
  });
  buildMultiChips();
}

function buildMultiChips(){
  var container = document.getElementById('chipsM');
  container.innerHTML = '';
  if(!multiChart) return;
  multiChart.data.datasets.forEach(function(ds, i){
    var isGC = ds.label === 'Curva Guía';
    var ch = document.createElement('div');
    ch.className = isGC ? 'chip chip-guia' : 'chip';
    if(!isGC){
      var dot = document.createElement('div');
      dot.className = 'dot';
      dot.style.background = ds.borderColor;
      ch.style.color = ds.borderColor;
      ch.appendChild(dot);
    }
    ch.appendChild(document.createTextNode(ds.label));
    (function(idx, chip){
      chip.onclick = function(){
        var vis = !multiChart.isDatasetVisible(idx);
        multiChart.setDatasetVisibility(idx, vis);
        multiChart.update('none');
        chip.classList.toggle('off', !vis);
      };
    })(i, ch);
    container.appendChild(ch);
  });
}

// ===== VISTA DE APORTES / DESCARGAS Y LLUVIA =====
// Un mes se considera parcial cuando el reporte de la CAR no trae todos sus días.
function mesesParciales(m){
  var out = [];
  for(var i=0;i<12;i++){
    if(m.act[i] !== null && m.dias[i] !== null && m.dias[i] < m.dim[i]) out.push(i);
  }
  return out;
}

function buildMetRow(){
  var c = cfg();
  var cont = document.getElementById('metRow');
  cont.innerHTML = '';
  c.orden.forEach(function(k){
    var m = c.met[k];
    var b = document.createElement('button');
    b.className = 'mbtn' + (k===MET ? ' active' : '');
    b.textContent = m.tit + ' (' + m.uni + ')';
    b.onclick = function(){ MET = k; buildMetRow(); drawFlow(); };
    cont.appendChild(b);
  });
}

function initFlow(){ buildMetRow(); drawFlow(); }

function drawFlow(){
  var c = cfg(), m = c.met[MET];
  var parc = mesesParciales(m);
  var dec = (MET === 'llu') ? 1 : 2;
  var verbo = (m.modo === 'acum') ? 'acum.' : 'prom.';

  if(flowChart){ flowChart.destroy(); flowChart = null; }

  var partialMonthPlugin = {
    id: 'partialMonthMarker',
    afterDatasetsDraw: function(chart) {
      var ds1 = chart.getDatasetMeta(1);
      if(!ds1) return;
      var c2d = chart.ctx;
      parc.forEach(function(idx) {
        if(!ds1.data[idx]) return;
        var bar = ds1.data[idx];
        c2d.save();
        c2d.fillStyle = '#1565c0';
        c2d.font = 'bold 11px Segoe UI, Arial';
        c2d.textAlign = 'center';
        c2d.fillText('⦿', bar.x, bar.y - 6);
        c2d.restore();
      });
    }
  };

  var ctx = document.getElementById('cf').getContext('2d');
  flowChart = new Chart(ctx, {
    type: 'bar',
    plugins: [partialMonthPlugin],
    data: {
      labels: MN,
      datasets: [
        { label:'Promedio histórico 2012–2022', data:m.hist,
          backgroundColor:'rgba(194,24,91,0.82)', borderColor:'#c2185b',
          borderWidth:1.5, borderRadius:3 },
        { label:String(ANIO_ACTUAL), data:m.act,
          backgroundColor:'rgba(21,101,192,0.82)', borderColor:'#1565c0',
          borderWidth:1.5, borderRadius:3 }
      ]
    },
    options: {
      responsive:true, maintainAspectRatio:false,
      animation:{ duration:350 },
      plugins:{
        legend:{ display:false },
        tooltip:{
          mode:'index', intersect:false,
          callbacks:{
            title:function(items){ return items[0] ? MN[items[0].dataIndex] : ''; },
            label:function(item){
              if(item.parsed.y === null) return null;
              var suffix = '';
              if(item.datasetIndex === 1 && parc.indexOf(item.dataIndex) >= 0){
                suffix = ' ★ ' + verbo + ' días 1–' + m.dias[item.dataIndex];
              }
              return item.dataset.label + ': ' + item.parsed.y.toFixed(dec) + ' ' + m.uni + suffix;
            }
          }
        }
      },
      scales:{
        x:{ grid:{ color:'rgba(0,0,0,.06)' }, ticks:{ font:{ size:11 } } },
        y:{
          min:0, ticks:{},
          title:{ display:true, text:m.tit+' ('+m.uni+')', font:{ size:11 } },
          grid:{ color:'rgba(0,0,0,.08)' }
        }
      }
    }
  });

  // Nota al pie: fuente y meses parciales
  var nota = m.tit + (m.modo === 'acum' ? ' mensual acumulada en ' : ' media mensual en ') + m.uni +
    ' &middot; Datos: reportes diarios ' + c.hoja + ', CAR';
  if(parc.length){
    nota += ' &middot; ' + parc.map(function(i){
      return MN[i] + ': ' + verbo + ' días 1&ndash;' + m.dias[i];
    }).join(' &middot; ');
  }
  document.getElementById('aflNote').innerHTML = nota;

  var hv = m.hist.filter(function(v){ return v !== null; });
  var av = m.act.filter(function(v){ return v !== null; });
  var ultimo = -1;
  for(var i=0;i<12;i++){ if(m.act[i] !== null) ultimo = i; }
  var etq = (m.modo === 'acum') ? 'Total' : 'Promedio';
  var hs = hv.reduce(function(a,b){ return a+b; }, 0);
  var as = av.reduce(function(a,b){ return a+b; }, 0);
  document.getElementById('infoF').innerHTML =
    etq + ' anual histórico: <b>' +
      (m.modo === 'acum' ? hs.toFixed(0) : (hs/hv.length).toFixed(2)) + ' ' + m.uni + '</b> &nbsp;&middot;&nbsp; ' +
    etq + ' ' + ANIO_ACTUAL + ' (Ene–' + MN[ultimo] + '): <b>' +
      (m.modo === 'acum' ? as.toFixed(0) : (as/av.length).toFixed(2)) + ' ' + m.uni + '</b> &nbsp;&middot;&nbsp; ' +
    'Fuente: reportes diarios CAR – Hoja ' + c.hoja;
}

function switchView(mode){
  VISTA = mode;
  document.getElementById('viewA').style.display = mode==='A' ? '' : 'none';
  document.getElementById('viewM').style.display = mode==='M' ? '' : 'none';
  document.getElementById('viewF').style.display = mode==='F' ? '' : 'none';
  document.getElementById('tabA').classList.toggle('active', mode==='A');
  document.getElementById('tabM').classList.toggle('active', mode==='M');
  document.getElementById('tabF').classList.toggle('active', mode==='F');
  if(mode==='M' && !multiChart) loadMulti(curMultiYrs);
  if(mode==='F' && !flowChart) initFlow();
  if(mode!=='A') tt.style.display='none';
}

cargarEmbalse();
